bundle:
  name: fe-bar-build

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the build
    default: serverless_stable_mkr_catalog
  schema:
    description: Schema for the build's tables
    default: mkr_claims
  warehouse_id:
    description: SQL warehouse for Genie / dashboards
    default: 22d236430dbb5df0

targets:
  dev:
    # Development mode gives each developer an isolated copy: UC objects become
    # dev_<user>_mkr_claims, jobs/pipelines get a [dev <user>] prefix, schedules are paused.
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com

  prod:
    # The environment the demo and committed evidence run on: unprefixed mkr_claims schema.
    mode: production
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
