bundle:
  name: fe-bar-build

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the build
    default: serverless_stable_mkr_catalog
  schema:
    description: Schema for the build's tables
    default: mkr_claims
  warehouse_id:
    description: SQL warehouse for Genie / dashboards
    default: 22d236430dbb5df0

targets:
  dev:
    # Not using `mode: development`: it forces a dev_<user>_ prefix on UC names, and Genie,
    # the app and the docs need stable table names. Single-user FEVM, so no collision risk.
    default: true
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
