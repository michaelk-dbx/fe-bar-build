bundle:
  name: fe-bar-build

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the build
    default: serverless_stable_mkr_catalog
  schema:
    description: Schema for the build's tables
    default: mkr_claims
  warehouse_id:
    description: SQL warehouse for Genie / dashboards
    default: 22d236430dbb5df0

targets:
  dev:
    # Dedicated dev schema dev_mkr_claims. `mode: development` would force a dev_<user>_ prefix,
    # so the dev behaviours we want are set explicitly instead.
    default: true
    variables:
      schema: dev_mkr_claims
    presets:
      trigger_pause_status: PAUSED
      pipelines_development: true
      tags:
        env: dev
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com

  prod:
    # The environment the demo and committed evidence run on: unprefixed mkr_claims schema.
    mode: production
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
