bundle:
  name: fe-bar-build

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the build
    default: serverless_stable_mkr_catalog
  schema:
    description: Schema for the build's tables
    default: mkr_claims
  warehouse_id:
    description: SQL warehouse for Genie / dashboards
    default: 22d236430dbb5df0

targets:
  dev:
    # Development mode: UC objects get the default dev_<user>_ prefix (dev_michael_krasnopolsky_mkr_claims),
    # jobs/pipelines get [dev <user>], schedules are paused and pipelines run in development mode.
    mode: development
    default: true
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com

  prod:
    # The environment the demo and committed evidence run on: unprefixed mkr_claims schema.
    mode: production
    workspace:
      host: https://fevm-serverless-stable-mkr.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
